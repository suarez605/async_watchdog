# Ruff configuration for async_watchdog
# Replaces manual line-length checks; compatible with flake8 E/W/F rules.

line-length = 79
target-version = "py311"

[lint]
# Mirror the flake8 rule set used previously
select = ["E", "W", "F"]
ignore = []

[format]
# Use double quotes to match existing codebase style
quote-style = "double"
indent-style = "space"
line-ending = "lf"
